<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="otGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Cyber Hexagon Shield -->
  <polygon points="32,10 52,21 52,43 32,54 12,43 12,21" fill="none" stroke="url(#otGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Circuit Nodes / Grid -->
  <circle cx="32" cy="10" r="2.5" fill="#22d3ee"/>
  <circle cx="52" cy="21" r="2" fill="#22d3ee"/>
  <circle cx="52" cy="43" r="2" fill="#3b82f6"/>
  <circle cx="32" cy="54" r="2.5" fill="#3b82f6"/>
  <circle cx="12" cy="43" r="2" fill="#3b82f6"/>
  <circle cx="12" cy="21" r="2" fill="#22d3ee"/>

  <!-- Core Crosshair Node -->
  <circle cx="32" cy="32" r="6" fill="#0369a1" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
  
  <!-- Sub-radar pulse line -->
  <line x1="32" y1="18" x2="32" y2="26" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="1 1"/>
  <line x1="32" y1="38" x2="32" y2="46" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="1 1"/>
  <line x1="18" y1="32" x2="26" y2="32" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="1 1"/>
  <line x1="38" y1="32" x2="46" y2="32" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="1 1"/>
</svg>
